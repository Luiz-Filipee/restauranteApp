<h3>Quantidade de mesas disponiveis: {{ mesasRestantes }}</h3>
<div class="mesa-container">
  <div *ngFor="let mesa of mesas" class="mesa-card" 
        [ngClass]="{'ocupada': mesa.status === 'ocupada'}"
        (click)="abrirFormularioPedido(mesa)">
    <div class="mesa-icon">
      <img src="/assets/icon-table.svg" alt="Mesa">
    </div>
    <!-- <div class="mesa-card add-mesa-card" (click)="adicionarMesa()">
      <div class="add-mesa-icon">
        <span class="material-icons">add</span>
      </div>
    </div>     -->
    <h3>{{ mesa.nome }}</h3>
    <p>Status: {{ mesa.status }}</p>
    <p>Cliente: {{ mesa.cliente?.nome || 'Nenhum' }}</p>
    <div class="buttons">
      <button *ngIf="mesa.status === 'disponivel'" (click)="reservarMesa(mesa, $event)">Reservar</button>
      <button class="btn-icon" (click)="deletarMesa(mesa, $event)">
        <span class="material-icons">delete</span>
      </button>
    </div>
  </div>

  <div class="mesa-card add-mesa-card" (click)="adicionarMesa()">
    <div class="add-mesa-icon">
      <span class="material-icons">add</span>
    </div>
    <h3>Adicionar Mesa</h3>
  </div>
</div>

<div *ngIf="exibirFormulario && formularioTipo === 'pedido'" class="pedido-form-tm">
  <div class="pedido-form">
    <h2>Adicionar Pedido</h2>
    <label for="nomeCliente">Nome do Cliente: </label>
    <input type="text" id="nomeCliente" [(ngModel)]="mesaSelecionada.cliente.nome" placeholder="Nome do Cliente">
    
    <label for="nomeMesa">Nome da Mesa: </label>
    <input type="text" id="nomeMesa" [(ngModel)]="mesaSelecionada.nome" disabled>
    
    <label for="itemPedido">Itens do Pedido: </label>
    <select (change)="atualizarItensPedido($event)" multiple>
      <option *ngFor="let item of itensMenu" [value]="item.id">{{ item.nome }}</option>
    </select>

    <br>
    <label for="nomeFuncionario">Funcionario: </label>
      <select  [(ngModel)]="funcionarioSelecionado">
        <option *ngFor="let funcionario of funcionarios" [ngValue]="funcionario.nome">{{ funcionario.nome }}</option>
      </select>
 
    <button (click)="salvarPedido()">Salvar Pedido</button>
    <button (click)="fecharFormulario()" class="red">Cancelar</button>
  </div>
</div>

<div *ngIf="exibirFormulario && formularioTipo === 'mesa'" class="pedido-form-tm">
  <div class="pedido-form">
      <h2>Adicionar Mesa</h2>
      <label for="nomeMesa">Nome da Mesa: </label>
      <input type="text" id="nomeMesa" [(ngModel)]="mesaSelecionada.nome" placeholder="Nome da Mesa">
      
      <label for="statusMesa">Status: </label>
      <select [(ngModel)]="mesaSelecionada.status">
          <option value="disponivel">Disponível</option>
          <option value="ocupada">Ocupada</option>
      </select>

      <label for="idCliente">Cliente: </label>
      <select  [(ngModel)]="mesaSelecionada.cliente" [compareWith]="compareClientes">
        <option *ngFor="let cliente of clientes" [ngValue]="cliente">{{ cliente.nome }}</option>
      </select>

      <button (click)="salvarMesa()">Salvar Mesa</button>
      <button (click)="fecharFormulario()" class="red">Cancelar</button>
  </div>
</div>
